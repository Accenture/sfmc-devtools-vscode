# Custom tests for mcdev
#
name: "Code Testing"

on:
    push:
        branches: [main, develop, hotfix]
    pull_request:
        # The branches below must be a subset of the branches above
        branches: [main, develop, hotfix]

jobs:
    lintandTesting:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node: [24]
                os: [ubuntu-latest, windows-latest]
        env:
            # Local-only development: caller must provide an accessible immutable source commit.
            # No registry or main-branch fallback can package an older mcdev silently.
            MCDEV_BUNDLE_SOURCE: ${{ github.workspace }}/.mcdev-source
            MCDEV_BUNDLE_EXPECTED_COMMIT: aab5ee99eb53d8c468956d84547c02acf336e191
        name: lint & test w/ node v${{ matrix.node }}
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  registry-url: https://registry.npmjs.org/

            - name: Checkout exact mcdev source (fails until local commit is accessible)
              uses: actions/checkout@v6
              with:
                  repository: Accenture/sfmc-devtools
                  ref: aab5ee99eb53d8c468956d84547c02acf336e191
                  path: .mcdev-source

            - run: npm ci --no-workspaces

            - run: npm run lint

            - run: npm run lint-ts

            - run: npm run compile

            - run: npm test --no-workspaces

            - run: npm run package:test --no-workspaces

            - run: npm run verify:vsix --no-workspaces -- sfmc-devtools-vscode-BETA.vsix
